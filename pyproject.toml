[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boomtranscript"
version = "0.1.0"
description = "A modern Discord transcript generator for discord.py."
readme = "README.md"
license = "MIT"
authors = [
    { name = "MateoBD" }
]
keywords = [
    "discord",
    "discord.py",
    "transcript",
    "html",
    "tickets"
]
requires-python = ">=3.10"

dependencies = [
    "discord.py>=2.4.0",
    "Jinja2>=3.1.4"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://github.com/TU_USUARIO/boomtranscript"
Repository = "https://github.com/TU_USUARIO/boomtranscript"
Issues = "https://github.com/TU_USUARIO/boomtranscript/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["boomtranscript*"]

[tool.setuptools.package-data]
boomtranscript = [
    "templates/*.html",
    "templates/*.css",
    "templates/*.js"
]
